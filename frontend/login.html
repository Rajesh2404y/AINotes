<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your AI Notes Summarizer account to access study summaries, interactive quizzes, learning analytics and multilingual translations.">
    <title>Sign In | AI Notes Summarizer</title>

    <!-- Synchronous Early Theme Initialization -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem("ainotes_theme_preference") || "light";
                const activeTheme = savedTheme === "auto"
                    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                    : savedTheme;
                document.documentElement.setAttribute("data-bs-theme", activeTheme);
            } catch (e) {}
        })();
    </script>

    <!-- Preconnect & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="position-absolute top-0 end-0 p-3">
        <button class="theme-toggle-btn btn btn-sm border-0" aria-label="Toggle dark or light theme">
            <i class="bi bi-sun-fill text-warning"></i>
        </button>
    </div>

    <main class="auth-wrapper" id="main-content">
        <div class="auth-card">
            <!-- Brand Logo -->
            <a href="index.html" class="auth-logo" aria-label="Return to AI Notes Homepage">
                <i class="bi bi-mortarboard-fill fs-3 text-primary"></i>
                <span>AI Notes<span class="text-secondary">.io</span></span>
            </a>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to access your notes, quizzes, and learning dashboard.</p>

            <!-- Alert Container for Dynamic Error Display -->
            <div id="alert-container"></div>

            <form id="login-form" novalidate>
                <!-- Email Address -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold small">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body-tertiary text-muted border-end-0">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control border-start-0" id="email" name="email" 
                               placeholder="student@university.edu" required autocomplete="email">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <a href="#" class="small text-decoration-none text-muted" onclick="alert('Password reset architecture is configured in API. Endpoint: /api/auth/reset-password'); return false;">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-body-tertiary text-muted border-end-0">
                            <i class="bi bi-shield-lock"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0" id="password" name="password" 
                               placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="btn btn-outline-secondary border-start-0 bg-body-tertiary" id="togglePasswordBtn" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small text-muted" for="rememberMe">Remember me on this browser</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-submit" class="btn btn-primary w-100 py-2 rounded-3 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="auth-divider my-4 text-center">
                <span class="text-muted small">NEW TO AI NOTES?</span>
            </div>

            <!-- Footer link -->
            <div class="auth-footer text-center">
                Don't have an account? <a href="register.html" class="fw-semibold">Create free account</a>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle & Frontend Scripts with Defer -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("togglePasswordBtn")?.addEventListener("click", function() {
                const pwInput = document.getElementById("password");
                const icon = this.querySelector("i");
                if (pwInput.type === "password") {
                    pwInput.type = "text";
                    icon.className = "bi bi-eye-slash";
                } else {
                    pwInput.type = "password";
                    icon.className = "bi bi-eye";
                }
            });
        });
    </script>
</body>
</html>
